name: Publish Release

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'src/IvkExportTool.Desktop/IvkExportTool.Desktop.csproj'

jobs:
  test:
    name: Run Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --configuration Release --no-restore

    - name: Run unit tests
      run: dotnet test --configuration Release --no-build --verbosity normal --filter "Category!=Integration"

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --configuration Release --no-restore

    - name: Run integration tests
      run: dotnet test --configuration Release --no-build --verbosity normal --filter "Category=Integration"

  publish:
    name: Publish for ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}
    needs: integration-tests
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
            artifact-name: IvkExportTool-linux-x64
            archive-format: tar.gz
          - os: windows-latest
            runtime: win-x64
            artifact-name: IvkExportTool-win-x64
            archive-format: zip

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract version from tag
      id: get_version
      run: |
        if [ "${{ github.ref_type }}" = "tag" ]; then
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Version extracted from tag: ${VERSION}"
        else
          VERSION="0.0.0-dev"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "No tag found, using development version: ${VERSION}"
        fi
      shell: bash

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Publish application
      run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --runtime ${{ matrix.runtime }} --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:DebugType=None /p:DebugSymbols=false /p:StripSymbols=true /p:Version=${{ env.VERSION }} /p:AssemblyVersion=${{ env.VERSION }} /p:FileVersion=${{ env.VERSION }} --output ./publish/${{ matrix.runtime }}

    - name: Rename executable (Linux)
      if: matrix.runtime == 'linux-x64'
      run: |
        mv ./publish/${{ matrix.runtime }}/IvkExportTool.Desktop ./publish/${{ matrix.runtime }}/IvkExportTool

    - name: Rename executable (Windows)
      if: matrix.runtime == 'win-x64'
      run: |
        Move-Item ./publish/${{ matrix.runtime }}/IvkExportTool.Desktop.exe ./publish/${{ matrix.runtime }}/IvkExportTool.exe

    - name: Create archive (Linux)
      if: matrix.archive-format == 'tar.gz'
      run: |
        cd ./publish/${{ matrix.runtime }}
        tar -czf ../${{ matrix.artifact-name }}.tar.gz *

    - name: Create archive (Windows)
      if: matrix.archive-format == 'zip'
      run: |
        cd ./publish/${{ matrix.runtime }}
        Compress-Archive -Path * -DestinationPath ../${{ matrix.artifact-name }}.zip

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: |
          ./publish/*.tar.gz
          ./publish/*.zip
        retention-days: 90

  create-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Display structure of downloaded files
      run: ls -R ./artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./artifacts/**/*.tar.gz
          ./artifacts/**/*.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
