name: Publish Release

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  PROJECT_PATH: 'src/IvkExportTool.Desktop/IvkExportTool.Desktop.csproj'

jobs:
  publish:
    name: Publish for ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
            artifact-name: IvkExportTool-linux-x64
            archive-format: tar.gz
          - os: windows-latest
            runtime: win-x64
            artifact-name: IvkExportTool-win-x64
            archive-format: zip

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Publish application
      run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --runtime ${{ matrix.runtime }} --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:DebugType=None /p:DebugSymbols=false --output ./publish/${{ matrix.runtime }}

    - name: Copy appsettings template (Linux)
      if: matrix.runtime == 'linux-x64'
      run: |
        cp src/IvkExportTool.Desktop/appsettings.template.json ./publish/${{ matrix.runtime }}/appsettings.json

    - name: Copy appsettings template (Windows)
      if: matrix.runtime == 'win-x64'
      run: |
        Copy-Item src/IvkExportTool.Desktop/appsettings.template.json ./publish/${{ matrix.runtime }}/appsettings.json

    - name: Create archive (Linux)
      if: matrix.archive-format == 'tar.gz'
      run: |
        cd ./publish
        tar -czf ${{ matrix.artifact-name }}.tar.gz ${{ matrix.runtime }}

    - name: Create archive (Windows)
      if: matrix.archive-format == 'zip'
      run: |
        cd ./publish
        Compress-Archive -Path ${{ matrix.runtime }} -DestinationPath ${{ matrix.artifact-name }}.zip

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: |
          ./publish/*.tar.gz
          ./publish/*.zip
        retention-days: 90

  create-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Display structure of downloaded files
      run: ls -R ./artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./artifacts/**/*.tar.gz
          ./artifacts/**/*.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
